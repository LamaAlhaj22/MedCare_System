<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin: 0;
            min-height: 100vh;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("medical.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .btn:hover {
            background: #357abd;
        }

        .card {
            width: 90%;
            text-align: left;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* MedCare */
        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }

        .title i {
            color: #e07a7a;
            margin-right: 8px;
        }

        h2 {
            margin-top: 30px;
        }

        .appointment-card {
            transition: 0.3s ease;
        }

        .appointment-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.25);
        }

        .btn {
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>

</html>

<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 800px; max-height: 90vh; overflow-y: auto;">
        <div class="title">
            <i class="fas fa-heartbeat"></i> MedCare
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>My Appointments</h3>
            <a href="patient-dashboard.html" class="btn btn-secondary btn-sm">Back to Dashboard</a>
        </div>
        <hr>

        <div class="card mb-3">
            <div class="card-body">
                <h5>Dr. Ahmad</h5>
                <p><strong>Specialty:</strong> Cardiology</p>
                <p><strong>Date:</strong> 2025-05-20</p>
                <p><strong>Time:</strong> 10:00 AM</p>
                <p><strong>Status:</strong> <span class="text-warning">Pending</span></p>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button class="btn btn-primary btn-sm">Edit</button>
                    <button class="btn btn-danger btn-sm">Cancel</button>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5>Dr. Lina</h5>
                <p><strong>Specialty:</strong> Dermatology</p>
                <p><strong>Date:</strong> 2025-05-22</p>
                <p><strong>Time:</strong> 12:30 PM</p>
                <p><strong>Status:</strong> <span class="text-success">Confirmed</span></p>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button class="btn btn-primary btn-sm">Edit</button>
                    <button class="btn btn-danger btn-sm">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
