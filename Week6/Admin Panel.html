<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            margin: 0;
            display: flex;
            min-height: 100vh;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("medical.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card {
            width: 90%;
            max-width: 500px;
            margin: 150px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        /* MedCare */
        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }

        .title i {
            color: #e07a7a;
            margin-right: 8px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 35px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 75%;
            padding: 15px 20px;
            margin: 10px auto;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
            gap: 12px;
        }


        .btn:first-of-type {
            margin-top: 23px;
        }

        .btn:hover {
            background: #357abd;
            transform: scale(1.03);
            transition: 0.3s;
        }

        @media (max-width: 600px) {
            .card {
                width: 95%;
                padding: 20px;
                margin: 30px auto;
            }

            .btn {
                font-size: 14px;
                padding: 12px;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="title">
            <i class="fa-solid fa-heart-pulse"></i> MedCare
        </div>
        <h2>Admin Panel</h2>
        <button class="btn">
            <i class="fa-solid fa-user-doctor"></i>
            Manage Doctors
        </button>

        <button class="btn">
            <i class="fa-solid fa-users"></i>
            Manage Patients
        </button>

        <button class="btn">
            <i class="fa-solid fa-calendar-check"></i>
            View Appointments
        </button>
    </div>
</body>

</html>
