<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("medical.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .page-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            transition: 0.3s;
        }

        .btn-primary {
            border-radius: 8px;
            padding: 8px 15px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            text-align: left;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .title i {
            color: #e07a7a;
            margin-right: 8px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .header-row h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-box {
            margin: 20px auto 35px;
            max-width: 500px;
        }

        .doctor-card {
            width: 90%;
            max-width: 380px;
            margin: 25px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .doctor-card h5 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .doctor-card p {
            margin-bottom: 12px;
        }

        .doctor-card .btn {
            margin-top: 10px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .main-card {
                width: 95%;
                padding: 22px;
                max-height: none;
            }

            .header-row {
                flex-direction: column;
                text-align: center;
            }

            .nav-buttons {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .filter-box {
                max-width: 100%;
            }

            .doctor-card {
                width: 100%;
                padding: 22px;
            }
        }
    </style>
</head>
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 800px; max-height: 90vh; overflow-y: auto;">
        <div class="title">
            <i class="fa-solid fa-heart-pulse"></i> MedCare
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Patient Dashboard</h3>

            <div>
                <a href="#" class="btn btn-outline-primary btn-sm">Profile</a>
                <a href="My Appointment.html" class="btn btn-outline-secondary btn-sm">My Appointments</a>
            </div>
        </div>

        <hr>
        <!-- Filter -->
        <div class="mb-4">
            <label class="form-label">Filter by Specialty</label>
            <select class="form-select">
                <option selected>Choose Specialty</option>
                <option>Cardiology</option>
                <option>Dermatology</option>
                <option>Neurology</option>
            </select>
        </div>

        <!-- Doctors -->

        <div class="card mb-3">
            <div class="card-body">
                <h5>Dr. Ahmad</h5>
                <p>Specialty: Cardiology</p>
                <p>Available: Monday 9:00 AM - 2:00 PM</p>
                <a href="Book Appointment.html" class="btn btn-primary">Book Appointment
                </a>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5>Dr. Lina</h5>
                <p>Specialty: Dermatology</p>
                <p>Available: Tuesday 10:00 AM - 3:00 PM</p>
                <a href="Book Appointment.html" class="btn btn-primary">Book Appointment</a>
            </div>
        </div>
    </div>
</div>
</body>

</html>
