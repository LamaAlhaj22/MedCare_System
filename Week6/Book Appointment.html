<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("medical.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .page-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }

        .title i {
            color: #e07a7a;
            margin-right: 8px;
            font-size: 20pxs;
        }

        h3 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 22px;
        }

        label {
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control {
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            border-radius: 8px;
            padding: 10px 18px;
        }

        @media (max-width: 600px) {
            .card {
                width: 95%;
                padding: 22px;
            }

            h3 {
                font-size: 22px;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>

<!-- Centered Container -->

<body>
    <div class="page-container">
        <div class="card">
            <div class="title">
                <i class="fa-solid fa-heart-pulse"></i> MedCare
            </div>
            <h3>Book Appointment</h3>
            <form>
                <label class="form-label">Doctor</label>
                <input type="text" class="form-control" value="Dr. Ahmad" readonly>

                <label class="form-label">Select Date</label>
                <input type="date" class="form-control">

                <label class="form-label">Select Time</label>
                <input type="time" class="form-control">

                <label class="form-label">Notes (Optional)</label>
                <textarea class="form-control" rows="3" placeholder="Enter notes..."></textarea>

                <div class="buttons">
                    <a href="patient-dashboard.html" class="btn btn-secondary">Back</a>
                    <button type="submit" class="btn btn-primary">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>
</body>
