<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("medical.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .btn:hover {
            background: #357abd;
        }

        .card {
            width: auto;
            margin: 80px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .main-card {
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .page-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .appointment-card {
            width: 90%;
            max-width: 420px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
            text-align: left;
        }

        .logout-btn {
            position: absolute;
            top: 30px;
            right: 30px;
        }

        .page-title {
            text-align: center;
            margin: 30px 0;
        }

        /* MedCare */
        .title {
            text-align: left;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .title i {
            color: #e07a7a;
            margin-right: 8px;
        }

        .line {
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .main-card {
                width: 95%;
                padding: 20px;
                max-height: none;
            }

            .appointment-card {
                width: 100%;
                padding: 20px;
            }

            .logout-btn {
                position: static;
                display: block;
                width: 100%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<!-- Centered Container -->

<body>

    <div class="page-container">
        <div class="main-card">

            <div class="title">
                <i class="fa-solid fa-heart-pulse"></i> MedCare
            </div>

            <div class="line"></div>

            <h3 class="page-title">Doctor Dashboard</h3>

            <a href="login.html" class="btn btn-secondary btn-sm logout-btn">Logout</a>

            <!-- Appointment 1 -->
            <div class="appointment-card">
                <h5>Patient: Lama</h5>
                <p><strong>Date:</strong> 20-05-2025 </p>
                <p><strong>Time:</strong> 10:00 AM</p>
                <p><strong>Notes:</strong> General Checkup</p>

                <label>Status:</label>
                <select class="form-select">
                    <option>Pending</option>
                    <option selected>Confirmed</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                </select>

                <button class="btn btn-primary btn-sm mt-3">Update</button>
            </div>

             <!-- Appointment 2 -->
            <div class="appointment-card">
                <h5>Patient: Ahmad</h5>
                <p><strong>Date:</strong> 22-05-2025 </p>
                <p><strong>Time:</strong> 10:30 AM</p>
                <p><strong>Notes:</strong> Skin Consulation</p>

                <label>Status:</label>
                <select class="form-select">
                    <option>Pending</option>
                    <option selected>Confirmed</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                </select>
                <button class="btn btn-primary btn-sm mt-3">Update</button>
            </div>
</body>

</html>
