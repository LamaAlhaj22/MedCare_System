<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
font-family: Arial;
margin: 0;
display: flex;
min-height: 100vh;
justify-content: center;
align-items: center;
text-align: center;
background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
url("medical.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
}

.card {
width: 90%;
max-width: 500px;
background: rgba(255, 255, 255, 0.95);
padding: 30px;
border-radius: 15px;
box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
}

/* title */
.title {
font-size: 22px;
font-weight: bold;
margin-bottom: 20px;
text-align: left;
border-bottom: 1px solid #ccc;
padding-bottom: 10px;
}

.title i {
color: #e07a7a;
margin-right: 8px;
}

h2 {
margin-top: 20px;
margin-bottom: 30px;
}

/* buttons */
.btn {
display: flex;
align-items: center;
justify-content: flex-start;
width: 75%;
padding: 15px 20px;
margin: 10px auto;
background: #4a90e2;
color: white;
border: none;
border-radius: 8px;
font-size: 16px;
cursor: pointer;
transition: 0.3s;
gap: 12px;
}

.btn:hover {
background: #357abd;
transform: scale(1.03);
}

/* message box */
#message {
margin-top: 20px;
font-weight: bold;
color: #2f6fb2;
}

/* Added loading */
#loading {
display: none;
margin-top: 15px;
font-weight: bold;
color: #357abd;
}

@media (max-width: 600px) {
.card {
width: 95%;
padding: 20px;
}
.btn {
font-size: 14px;
padding: 12px;
}
}

</style>
</head>

<body>

<div class="card">

<div class="title">
<i class="fa-solid fa-heart-pulse"></i> MedCare
</div>

<h2 id="titleText">Admin Panel</h2>

<!-- Added loading -->
<div id="loading">Loading data...</div>

<!-- Buttons Container -->
<div id="buttonsContainer"></div>

<div id="message"></div>

</div>

<script>

let adminSections = [];

// AJAX Simulation
function loadSections() {

    document.getElementById("loading").style.display = "block";

    setTimeout(() => {

        adminSections = [

            {
                title: "Manage Doctors",
                icon: "fa-user-doctor",
                message: "Doctors Section Opened"
            },

            {
                title: "Manage Patients",
                icon: "fa-users",
                message: "Patients Section Opened"
            },

            {
                title: "View Appointments",
                icon: "fa-calendar-check",
                message: "Appointments Loaded"
            }

        ];

        document.getElementById("loading").style.display = "none";

        displaySections();

    }, 1500);
}

// Display buttons dynamically
function displaySections() {

    let container = document.getElementById("buttonsContainer");

    container.innerHTML = "";

    adminSections.forEach(section => {

        container.innerHTML += `

        <button class="btn"
        onclick="showMessage('${section.message}')">

        <i class="fa-solid ${section.icon}"></i>

        ${section.title}

        </button>

        `;
    });
}

function showMessage(text) {
    
    // DOM Manipulation
    document.getElementById("message").innerText = text;

    document.getElementById("titleText").innerText =
    "Admin Working...";

}

window.onload = loadSections;

</script>

</body>
</html>
